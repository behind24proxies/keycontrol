# ──────────────────────────────────────────────────────────────────────────────
# Nginx — reverse-proxy for the KeyControl dashboard + gateway
#
# Single-port architecture: everything is served on port 80 (mapped to
# DASHBOARD_PORT on the host, default 8080).
#
# How routing works:
#   /api/*             → proxied to backend:3001  (admin REST API)
#   /gateway/*         → proxied to backend:3001  (gateway proxy for API consumers)
#   /docs, /openapi*   → proxied to backend:3001  (Scalar API docs)
#   everything else    → frontend SPA (index.html fallback)
# ──────────────────────────────────────────────────────────────────────────────

upstream backend {
    server backend:3001;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip ──────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Admin API ─────────────────────────────────────────────────────────
    # Match /api exactly or /api/... (but NOT /api-keys, /api-docs, etc.)
    # This is critical because the frontend has SPA routes like /api-keys
    # that would otherwise be incorrectly proxied to the backend.
    location ~ ^/api(/|$) {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if ever needed)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Increase timeouts for large payloads
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 50m;
    }

    # ── Gateway Proxy ─────────────────────────────────────────────────────
    # Forward /gateway/* requests to the backend gateway handler.
    # External API consumers send requests here with their API keys.
    location /gateway/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 50m;
    }

    # ── API Docs (Scalar) ─────────────────────────────────────────────────
    location /docs {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.yaml {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Frontend SPA ──────────────────────────────────────────────────────
    # Serve static files first; fall back to index.html for SPA routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache static assets ───────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
