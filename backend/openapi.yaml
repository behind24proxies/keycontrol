          schema:
            type: string
        - name: api_key_id
          in: query
          schema:
            type: string
        - name: method
          in: query
          schema:
            type: string
        - name: status_code
          in: query
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
            format: date-time
        - name: date_to
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: string
            default: "1"
        - name: per_page
          in: query
          schema:
            type: string
