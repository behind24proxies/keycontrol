    post:
      tags: [Presets]
      operationId: createPreset
      summary: Create a new preset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  maxLength: 500
                  nullable: true
                rate_limit_id:
                  type: integer
                  nullable: true
                ip_allowlist_id:
                  type: integer
                  nullable: true
                ip_blocklist_id:
                  type: integer
                  nullable: true
                endpoint_group_ids:
                  type: array
                  default: []
                  items:
                    type: integer
                resource_ids:
                  type: array
                  default: []
                  items:
                    type: integer
                endpoint_group_settings:
                  type: object
                  description: "Map of endpoint_group_id → { usage_limit, lease_seconds }"
                  additionalProperties:
                    type: object
                    properties:
                      usage_limit:
                        type: integer
                        nullable: true
                      lease_seconds:
                        type: integer
                        nullable: true
                resource_settings:
                  type: object
                  description: "Map of resource_id → { usage_limit, lease_seconds }"
                  additionalProperties:
                    type: object
                    properties:
                      usage_limit:
                        type: integer
                        nullable: true
                      lease_seconds:
                        type: integer
                        nullable: true
                allowed_methods:
                  type: array
                  items:
                    type: string
                    enum: [GET, POST, PUT, PATCH, DELETE, HEAD]
                  minItems: 1
      responses:
        "201":
          description: Created preset (enriched)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preset"
        "400":
          description: Validation error or FK not found
          content:
            application/json:
              schema:
