  # ── Presets ──────────────────────────────────────────────────────────
  /presets:
    get:
      tags: [Presets]
      operationId: listPresets
      summary: List all presets with enriched data
      responses:
        "200":
          description: Array of enriched presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Preset"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Presets]
      operationId: createPreset
      summary: Create a new preset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  maxLength: 500
                  nullable: true
                rate_limit_id:
                  type: integer
                  nullable: true
                ip_allowlist_id:
                  type: integer
                  nullable: true
                ip_blocklist_id:
                  type: integer
                  nullable: true
                endpoint_group_ids:
                  type: array
                  default: []
                  items:
                    type: integer
                resource_ids:
                  type: array
                  default: []
                  items:
                    type: integer
                endpoint_group_settings:
                  type: object
                  description: "Map of endpoint_group_id → { usage_limit, lease_seconds }"
                  additionalProperties:
                    type: object
                    properties:
                      usage_limit:
                        type: integer
                        nullable: true
                      lease_seconds:
                        type: integer
                        nullable: true
                resource_settings:
                  type: object
                  description: "Map of resource_id → { usage_limit, lease_seconds }"
                  additionalProperties:
                    type: object
                    properties:
                      usage_limit:
                        type: integer
                        nullable: true
                      lease_seconds:
                        type: integer
                        nullable: true
                allowed_methods:
                  type: array
                  items:
                    type: string
                    enum: [GET, POST, PUT, PATCH, DELETE, HEAD]
                  minItems: 1
      responses:
        "201":
          description: Created preset (enriched)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preset"
        "400":
          description: Validation error or FK not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /presets/batch-update:
    post:
      tags: [Presets]
      operationId: batchUpdatePresets
      summary: Add or remove resources/endpoint groups from multiple presets at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preset_ids]
              properties:
                preset_ids:
                  type: array
                  minItems: 1
                  items:
                    type: integer
                resource_ids:
                  type: array
                  default: []
                  items:
                    type: integer
                endpoint_group_ids:
                  type: array
                  default: []
                  items:
                    type: integer
                endpoint_group_settings:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      usage_limit:
                        type: integer
                        nullable: true
                      lease_seconds:
                        type: integer
                        nullable: true
                operation:
                  type: string
                  enum: [add, remove]
                  default: add
      responses:
        "200":
          description: Batch update result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  updated_count:
                    type: integer
        "400":
          description: Validation error or FK not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Cannot batch-update system presets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Preset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /presets/{id}:
    get:
      tags: [Presets]
      operationId: getPreset
      summary: Get a single enriched preset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Enriched preset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preset"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Presets]
      operationId: updatePreset
      summary: Update a preset
      description: System presets cannot be modified.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  maxLength: 500
                  nullable: true
                is_full_access:
                  type: boolean
                rate_limit_id:
                  type: integer
                  nullable: true
                ip_allowlist_id:
                  type: integer
                  nullable: true
                ip_blocklist_id:
                  type: integer
                  nullable: true
                endpoint_group_ids:
                  type: array
                  items:
                    type: integer
                resource_ids:
                  type: array
                  items:
                    type: integer
                endpoint_group_settings:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      usage_limit:
                        type: integer
                        nullable: true
                      lease_seconds:
                        type: integer
                        nullable: true
                resource_settings:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      usage_limit:
                        type: integer
                        nullable: true
                      lease_seconds:
                        type: integer
                        nullable: true
                allowed_methods:
                  type: array
                  items:
                    type: string
                    enum: [GET, POST, PUT, PATCH, DELETE, HEAD]
                  minItems: 1
      responses:
        "200":
          description: Updated preset (enriched)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preset"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: System presets cannot be modified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Presets]
      operationId: deletePreset
      summary: Delete a preset
      description: |
        System presets cannot be deleted. If API keys are assigned to this preset,
        you must provide `reassign_preset_id` to reassign them. Without it, returns 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: reassign_preset_id
          in: query
          required: false
          schema:
            type: integer
          description: Target preset ID to reassign API keys to before deletion
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessFlag"
        "400":
          description: Cannot reassign to same preset / target not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: System presets cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Preset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: API keys assigned — provide reassign_preset_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  api_key_count:
                    type: integer
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /presets/{id}/duplicate:
    post:
      tags: [Presets]
      operationId: duplicatePreset
      summary: Duplicate a preset (deep copy of all relations)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Duplicated preset (enriched)
          content:
            application/json:
              schema:
