      operationId: updateEndpointGroup
      summary: Update an endpoint group (replaces all endpoints)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                description:
                  type: string
                  nullable: true
                endpoints:
                  type: array
                  default: []
                  items:
                    type: object
                    required: [url_pattern, method]
                    properties:
                      url_pattern:
                        type: string
                      method:
                        type: string
      responses:
        "200":
          description: Updated endpoint group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointGroup"
        "400":
          description: Duplicate name or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Endpoint group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Endpoint Groups]
      operationId: deleteEndpointGroup
      summary: Delete an endpoint group
      description: |
        If presets reference this group and `force` is not `true`, returns a confirmation
        payload listing affected presets instead of deleting.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: force
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
          description: Set to `true` to force-delete and cascade-remove preset associations
      responses:
        "200":
          description: Deleted, or confirmation required
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SuccessFlag"
                  - type: object
                    properties:
                      confirm_required:
                        type: boolean
                        const: true
                      associated_preset_count:
                        type: integer
                      associated_presets:
                        type: array
                        items:
                          $ref: "#/components/schemas/AssociatedPresetRef"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Endpoint group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /endpoint-groups/{id}/associated-keys:
