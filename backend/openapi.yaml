openapi: "3.1.0"
info:
  title: KeyControl API
  version: "1.0.0"
  description: |
    # Overview
    Welcome to the official API documentation for the KeyControl gateway platform. This API provides the programmatic interface for securely managing, routing, and validating your API keys.

    ## Authentication
    This API uses **two distinct authentication schemes** depending on the endpoint type:

    | Endpoint type | Scheme | Token format | Header example |
    |---|---|---|---|
    | **Admin API** (`/api/*`) | `BearerAuth` | JWT or Master API Key (`mk-`) | `Authorization: Bearer <jwt_or_mk-key>` |
    | **Gateway / proxy** (`/{resource}/*`) | `GatewayApiKey` | KeyControl API Key (`uc-`) | `Authorization: Bearer uc-<key>` |
    | **Auth routes** (`/api/auth/*`) | *(none — public)* | — | — |

    ### Admin API (`BearerAuth`)
    All admin endpoints (Resources, Presets, API Keys, Logs, etc.) require a JWT or Master API Key:
    - **JWT** — obtained via `POST /api/auth/login`
    - **Master API Key** — prefixed `mk-`, generated via `POST /api/organization/master-key`

    ### Gateway (`GatewayApiKey`)
    The proxy/gateway endpoint (`/{resourcePath}/{endpointPath}`) uses a **KeyControl API Key** (prefixed `uc-`) — entirely separate from admin credentials. The gateway auto-detects this key in any header, query parameter, or text body.
servers:
  - url: "{scheme}://{host}:{port}/api"
    description: Admin API
    variables:
      scheme:
        default: http
        enum: [http, https]
      host:
        default: localhost
      port:
        default: "3000"
  - url: "{scheme}://{host}:{port}"
    description: Gateway (root — for Quick Start / proxy requests)
    variables:
      scheme:
        default: http
        enum: [http, https]
      host:
        default: localhost
      port:
        default: "3000"

security:
  - BearerAuth: []

tags:
  - name: Auth
    description: Login & two-factor authentication (public — no Bearer token required)
  - name: Organization
    description: Organization profile, 2FA, session, IP-logging, and master key management
  - name: Resources
    description: CRUD for upstream API resources (resources)
  - name: Endpoint Groups
    description: CRUD for endpoint groups within resources
  - name: API Keys
    description: CRUD and rotation of use-case API keys
  - name: IP Allowlists
    description: CRUD for IP allowlist policies
  - name: IP Blocklists
    description: CRUD for IP blocklist policies
  - name: Rate Limits
    description: CRUD for rate-limit policies
  - name: Presets
    description: CRUD, duplication, and batch-update of access presets
  - name: Logs
    description: Request logs, dashboard stats, and log settings
  - name: Quick Start
    description: |
      Step-by-step guide to getting started with the KeyControl gateway using Groq as an example.

      **Authentication:** Gateway requests use a **KeyControl API Key** (prefixed `uc-`), authenticated via the `GatewayApiKey` Bearer scheme — not the admin `BearerAuth` scheme used for managing resources, presets, and keys. The `uc-` key is automatically detected and replaced with the real upstream secret before forwarding.

      **Setup steps:**
      1. Create a **Resource** (e.g., Groq) with its secret API key and base URL via `POST /api/resources`
      2. Create a **Preset** to define access controls (rate limits, IP restrictions, allowed methods) via `POST /api/presets`
      3. Create an **API Key** linked to that preset via `POST /api/api-keys`
      4. Send requests to `/{resourcePath}/{endpointPath}` with `Authorization: Bearer uc-<your-key>` — the gateway validates, substitutes the real key, and forwards to the upstream API

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or Master API Key (mk-)
      description: |
        The default authentication scheme for all admin API endpoints.
        Pass either:
        • A **JWT** returned by `POST /auth/login` (or `/auth/login/verify-2fa`).
        • A **Master API Key** (prefixed `mk-`) generated via `POST /organization/master-key`.
        Both are passed as a standard Bearer token in the `Authorization` header.

    GatewayApiKey:
      type: http
      scheme: bearer
      bearerFormat: KeyControl API Key (uc-)
      description: |
        Authentication for gateway (proxy) requests.
        Pass a **KeyControl API Key** (prefixed `uc-`) as a Bearer token:

        `Authorization: Bearer uc-<your-keycontrol-api-key>`

        Alternatively, the gateway also detects the `uc-` key in any request header,
        query parameter, or text-based request body — Bearer is the recommended convention.

  schemas:
    # ── Reusable error envelope ──────────────────────────────────────
    ErrorResponse:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Machine-readable error code
          enum:
            - VALIDATION_ERROR
            - BAD_REQUEST
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - INTERNAL_ERROR
            - METHOD_NOT_ALLOWED
            - PAYLOAD_TOO_LARGE
            - BAD_GATEWAY
            - GATEWAY_TIMEOUT
        details:
          description: Additional error context. Validation errors use an array; debug mode returns an object with diagnostic info.
          oneOf:
            - type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  message:
                    type: string
            - type: object
              description: Debug details (only when debug_mode is enabled on the organization)
              properties:
                reason:
                  type: string
                  enum: [PRESET_METHOD_RESTRICTION, PRESET_ENDPOINT_RESTRICTION, PRESET_RESOURCE_RESTRICTION]
                requested_method:
                  type: string
                requested_path:
                  type: string
                allowed_methods:
                  type: array
                  items:
                    type: string
                allowed_endpoint_groups:
                  type: array
                  items:
                    type: object
                    properties:
                      group_name:
                        type: string
                      endpoints:
                        type: array
                        items:
                          type: object
                          properties:
                            method:
                              type: string
                            pattern:
                              type: string
                preset_name:
                  type: string
                requested_resource:
                  type: string

    SuccessFlag:
      type: object
      properties:
        success:
          type: boolean
          example: true

    Pagination:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    # ── Domain schemas ───────────────────────────────────────────────
    Endpoint:
      type: object
      required: [url_pattern, method]
      properties:
        id:
          type: integer
        url_pattern:
          type: string
        method:
          type: string

    EndpointGroupBrief:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        resource_id:
          type: integer
        resource_name:
          type: string
        lease_seconds:
          type: integer
          nullable: true
        usage_limit:
          type: integer
          nullable: true
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/Endpoint"

    ResourceBrief:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        unique_path:
          type: string
        external_api_base_url:
          type: string
        usage_limit:
          type: integer
          nullable: true
        lease_seconds:
          type: integer
          nullable: true

    RateLimitRule:
      type: object
      required: [requests, window_seconds]
      properties:
        requests:
          type: integer
          minimum: 1
        window_seconds:
          type: integer
          minimum: 1

    UsageInfo:
      type: object
      properties:
        preset_count:
          type: integer
        preset_names:
          type: array
          items:
            type: string

    AssociatedPresetRef:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    Resource:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        unique_path:
          type: string
        secret_api_key:
          type: string
        external_api_base_url:
          type: string
        description:
          type: string
          nullable: true
        timeout_seconds:
          type: integer
          nullable: true
        timeout_response_code:
          type: integer
          default: 504
        timeout_response_body:
          type: string
          default: '{"error": "Request timeout"}'
        timeout_response_type:
          type: string
          enum: [json, text, xml]
          default: json
        created_at:
          type: string
          format: date-time
        total_usage_count:
          type: integer
        endpoint_groups_count:
          type: integer
        last_used:
          type: string
          format: date-time
          nullable: true

    ResourceDetail:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            endpoint_groups:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  resource_id:
                    type: integer
                  endpoints:
                    type: array
                    items:
                      $ref: "#/components/schemas/Endpoint"

    EndpointGroup:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/Endpoint"

    ApiKey:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        api_key:
          type: string
        preset_id:
          type: integer
        preset_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    IpAllowlist:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        ips:
          type: string
          description: Newline-separated IP patterns (exact, wildcard, or CIDR)
        response_code:
          type: integer
          default: 403
          readOnly: true
        response_body:
          type: string
        response_type:
          type: string
          default: json
          readOnly: true
        created_at:
          type: string
          format: date-time
        usage:
          $ref: "#/components/schemas/UsageInfo"

    IpBlocklist:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        ips:
          type: string
        response_code:
          type: integer
          default: 403
          readOnly: true
        response_body:
          type: string
        response_type:
          type: string
          default: json
          readOnly: true
        created_at:
          type: string
          format: date-time
        usage:
          $ref: "#/components/schemas/UsageInfo"

    RateLimit:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        response_code:
          type: integer
          default: 429
          readOnly: true
        response_body:
          type: string
        response_type:
          type: string
          default: json
          readOnly: true
        rules:
          type: array
          items:
            $ref: "#/components/schemas/RateLimitRule"
        created_at:
          type: string
          format: date-time
        usage:
          $ref: "#/components/schemas/UsageInfo"

    Preset:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        is_full_access:
          type: boolean
        is_system:
          type: boolean
        rate_limit_id:
          type: integer
          nullable: true
        rate_limit_name:
          type: string
          nullable: true
        rate_limit_rules:
          type: array
          items:
            $ref: "#/components/schemas/RateLimitRule"
        ip_allowlist_id:
          type: integer
          nullable: true
        ip_allowlist_name:
          type: string
          nullable: true
        ip_blocklist_id:
          type: integer
          nullable: true
        ip_blocklist_name:
          type: string
          nullable: true
        allowed_methods:
          type: array
          items:
            type: string
            enum: [GET, POST, PUT, PATCH, DELETE, HEAD]
        endpoint_groups:
          type: array
          items:
            $ref: "#/components/schemas/EndpointGroupBrief"
        resources:
          type: array
          items:
            $ref: "#/components/schemas/ResourceBrief"
        api_key_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RequestLog:
      type: object
      properties:
        id:
          type: integer
        api_key_id:
          type: integer
        resource_id:
          type: integer
          nullable: true
        method:
          type: string
        url:
          type: string
        response_code:
          type: integer
        duration_ms:
          type: number
        ip:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

# ─────────────────────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────────────────────
paths:
  # ── Auth ───────────────────────────────────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Authenticate with admin password
      description: |
        Validates the admin password against the bcrypt-hashed password stored
        on the organization. If 2FA is enabled, returns `requires_2fa: true`
        and the caller must proceed to `/auth/login/verify-2fa`.
        Otherwise returns a JWT directly.

        Also returns `password_is_initial: true` if the password has never been
        changed from the initial seed value (set from the `ADMIN_TOKEN` env var
        on first boot). The frontend uses this to show a password change warning.

        Rate-limited to 5 failed attempts per IP per 15-minute window.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 1
                  description: The admin password
      responses:
        "200":
          description: Successful authentication
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: Direct JWT (no 2FA)
                    properties:
                      success:
                        type: boolean
                      token:
                        type: string
                        description: JWT access token
                      password_is_initial:
                        type: boolean
                        description: True if the password has never been changed from the initial env seed
                  - type: object
                    description: 2FA required
                    properties:
                      success:
                        type: boolean
                      requires_2fa:
                        type: boolean
                        const: true
                      password_is_initial:
                        type: boolean
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many failed attempts — rate-limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login/verify-2fa:
    post:
      tags: [Auth]
      operationId: verify2FA
      summary: Complete login with 2FA TOTP code
      description: |
        Re-validates the admin password and verifies the TOTP code.
        Returns a JWT on success. Rate-limited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, totp_code]
              properties:
                password:
                  type: string
                  minLength: 1
                  description: The admin password
                totp_code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  description: 6-digit TOTP code from authenticator app
      responses:
        "200":
          description: 2FA verified — JWT issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  token:
                    type: string
                  password_is_initial:
                    type: boolean
        "400":
          description: Bad request (e.g. 2FA not enabled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid password or 2FA code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many failed attempts — rate-limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Reset admin password using RESET_HASH
      description: |
        Public endpoint for password recovery. Requires the `RESET_HASH`
        environment variable to be set on the server.

        Security measures:
        - Each reset hash can only be used **once**. After use, the same hash
          is rejected until it is changed in the `.env` and the server is restarted.
        - Rate-limited to 5 attempts per IP per 15-minute window.
        - Timing-safe comparison of the reset hash.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reset_hash, new_password]
              properties:
                reset_hash:
                  type: string
                  minLength: 1
                  description: The RESET_HASH value from the server's .env file
                new_password:
                  type: string
                  minLength: 8
                  description: New admin password (minimum 8 characters)
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        "400":
          description: Reset not configured, hash already used, or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid reset credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many failed attempts — rate-limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Organization ───────────────────────────────────────────────────
  /organization/profile:
    get:
      tags: [Organization]
      operationId: getOrganizationProfile
      summary: Get organization profile
      responses:
        "200":
          description: Organization profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  two_factor_enabled:
                    type: boolean
                  session_timeout_seconds:
                    type: integer
                  log_ip_addresses:
                    type: boolean
                  organization_code:
                    type: string
                    pattern: "^[a-z0-9]{6}$"
                  master_api_key_prefix:
                    type: string
                    nullable: true
                  debug_mode:
                    type: boolean
                    description: Whether gateway debug mode is enabled
                  password_is_initial:
                    type: boolean
                    description: True if the admin password has never been changed from the initial env seed
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organization/organization-code:
    put:
      tags: [Organization]
      operationId: updateOrganizationCode
      summary: Update organization code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_code]
              properties:
                organization_code:
                  type: string
                  pattern: "^[a-z0-9]{6}$"
                  description: Exactly 6 lowercase alphanumeric characters
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  organization_code:
                    type: string
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organization/two-factor/generate:
    post:
      tags: [Organization]
      operationId: generate2FA
      summary: Generate a new 2FA secret and QR code
      responses:
        "200":
          description: 2FA secret generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                  qr_code:
                    type: string
                    description: Base64-encoded data-URI of the QR code image
                  otpauth_url:
                    type: string
                  manual_entry_key:
                    type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organization/two-factor/verify:
    post:
      tags: [Organization]
      operationId: verifyAndEnable2FA
      summary: Verify TOTP code and enable 2FA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 6
                  maxLength: 6
                  description: 6-digit TOTP verification code
      responses:
        "200":
          description: 2FA enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        "400":
          description: Invalid code or secret not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organization/two-factor/disable:
    post:
      tags: [Organization]
      operationId: disable2FA
      summary: Disable 2FA (requires current TOTP code)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 6
                  maxLength: 6
      responses:
        "200":
          description: 2FA disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        "400":
          description: 2FA not enabled or invalid code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid TOTP code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organization/session-timeout:
    put:
      tags: [Organization]
      operationId: updateSessionTimeout
      summary: Update JWT session timeout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_timeout_seconds]
              properties:
                session_timeout_seconds:
                  type: integer
                  minimum: 120
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  session_timeout_seconds:
                    type: integer
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organization/ip-logging:
    put:
      tags: [Organization]
      operationId: updateIpLogging
      summary: Toggle IP address logging for gateway requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [log_ip_addresses]
              properties:
