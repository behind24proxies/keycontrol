                  type: array
                  default: []
                  items:
                    type: integer
                endpoint_group_settings:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      usage_limit:
                        type: integer
                        nullable: true
                      lease_seconds:
                        type: integer
                        nullable: true
                operation:
                  type: string
