          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Resources]
      operationId: createResource
      summary: Create a new resource (resource)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, unique_path, secret_api_key]
              properties:
                name:
                  type: string
                  minLength: 1
                unique_path:
                  type: string
                  minLength: 1
                  description: URL-safe slug used as the gateway path prefix
                secret_api_key:
                  type: string
                  minLength: 1
                  description: The real upstream API key (kept server-side)
                external_api_base_url:
                  type: string
                  description: Base URL of the upstream API
                external_api_url:
                  type: string
                  description: Alias for external_api_base_url
                description:
                  type: string
                  nullable: true
                timeout_seconds:
                  type: integer
                  nullable: true
                timeout_response_code:
                  type: integer
                  default: 504
                timeout_response_body:
                  type: string
                  default: '{"error": "Request timeout"}'
                timeout_response_type:
                  type: string
                  enum: [json, text, xml]
                  default: json
      responses:
        "200":
          description: Created resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Unique path already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

