      tags: [Rate Limits]
      operationId: createRateLimit
      summary: Create a rate-limit policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                rules:
                  type: array
                  default: []
                  items:
                    $ref: "#/components/schemas/RateLimitRule"
                response_body:
                  type: string
                  default: '{"error": "Rate limit exceeded"}'
      responses:
        "201":
          description: Created rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimit"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rate-limits/{id}:
    put:
      tags: [Rate Limits]
