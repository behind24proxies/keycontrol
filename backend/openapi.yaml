      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  maxLength: 500
                  nullable: true
                is_full_access:
                  type: boolean
                rate_limit_id:
                  type: integer
                  nullable: true
                ip_allowlist_id:
                  type: integer
                  nullable: true
                ip_blocklist_id:
                  type: integer
                  nullable: true
                endpoint_group_ids:
                  type: array
                  items:
                    type: integer
                resource_ids:
                  type: array
                  items:
                    type: integer
                endpoint_group_settings:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      usage_limit:
                        type: integer
                        nullable: true
                      lease_seconds:
                        type: integer
                        nullable: true
                resource_settings:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      usage_limit:
                        type: integer
                        nullable: true
                      lease_seconds:
                        type: integer
                        nullable: true
                allowed_methods:
                  type: array
                  items:
                    type: string
                    enum: [GET, POST, PUT, PATCH, DELETE, HEAD]
                  minItems: 1
      responses:
        "200":
          description: Updated preset (enriched)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preset"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: System presets cannot be modified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
