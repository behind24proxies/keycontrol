        "409":
          description: Name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Presets]
      operationId: deletePreset
      summary: Delete a preset
      description: |
        System presets cannot be deleted. If API keys are assigned to this preset,
        you must provide `reassign_preset_id` to reassign them. Without it, returns 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: reassign_preset_id
          in: query
          required: false
          schema:
            type: integer
          description: Target preset ID to reassign API keys to before deletion
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessFlag"
        "400":
          description: Cannot reassign to same preset / target not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: System presets cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Preset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: API keys assigned — provide reassign_preset_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  api_key_count:
                    type: integer
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

