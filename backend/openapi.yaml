  /organization/password:
    put:
      tags: [Organization]
      operationId: changePassword
      summary: Change admin password
      description: |
        Authenticated endpoint to change the admin dashboard password.
        Requires the current password for verification and a new password
        (minimum 8 characters, must differ from current).
      requestBody:
        required: true
