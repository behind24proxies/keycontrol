        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organization/master-key/generate:
    post:
      tags: [Organization]
      operationId: generateMasterKey
      summary: Generate or regenerate the Master API Key
      description: |
        Only JWT-authenticated admins may call this endpoint (not via Master Key auth).
        Returns the plaintext key **once** — it cannot be retrieved again.
      responses:
        "200":
          description: Master key generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  master_api_key:
                    type: string
                    description: Plaintext key — save it now; it will not be shown again
                  prefix:
                    type: string
                  message:
                    type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — cannot manage master key via master key auth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

