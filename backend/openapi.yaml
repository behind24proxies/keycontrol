                  resource_count:
                    type: integer
                  preset_count:
                    type: integer
                  requests_24h:
                    type: integer
                  avg_response_time_ms:
                    type: integer
                  success_count:
                    type: integer
                  client_error_count:
                    type: integer
                  server_error_count:
                    type: integer
                  recent_logs:
                    type: array
                    maxItems: 10
