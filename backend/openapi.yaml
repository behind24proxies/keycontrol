      description: Fails if any presets are still using this rate limit.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessFlag"
        "400":
          description: Presets still reference this rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rate-limits/{id}/associated-presets:
    get:
      tags: [Rate Limits]
      operationId: getRateLimitAssociatedPresets
      summary: List presets using this rate limit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Associated presets
          content:
            application/json:
              schema:
                type: object
                properties:
                  associated_presets:
                    type: array
                    items:
                      $ref: "#/components/schemas/AssociatedPresetRef"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
